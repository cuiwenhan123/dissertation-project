name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy opencv-python-headless Pillow pycocotools PyYAML
      - name: Compile Python sources
        run: python -m compileall -q backend server.py pycharm_run.py sync_previous_study.py
      - name: Check JavaScript syntax
        run: find backend/static/js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
